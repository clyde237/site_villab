name: Vérifications

# Le dépôt ne contient aucun test : la compilation et le contrôle de types
# sont donc les seuls garde-fous avant publication. Sans eux, une erreur de
# syntaxe ou un import cassé ne se manifestait qu'au build de l'image — ou,
# pire, sur le site public d'un établissement.
on:
  # Pas de déclencheur « push » : pousser une branche dont la demande de
  # fusion est déjà ouverte lançait deux fois la même suite sur le même
  # commit. La demande de fusion couvre l'avant-fusion, build-image.yml
  # couvre main.
  pull_request:
  workflow_call:      # appelé par build-image.yml, qui refuse de publier si ceci échoue
  workflow_dispatch:

# Trois poussées d'affilée n'ont qu'un dernier état utile : les précédentes
# sont abandonnées au lieu de faire la queue. Jamais sur main, où la
# publication d'image ne doit pas pouvoir être interrompue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Contrôle de types & compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Même version que l'image de production (node:22-alpine) : vérifier
          # sur une autre reviendrait à valider un environnement que personne
          # n'exécute.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, et non npm install : il installe exactement le verrou et
      # échoue si package-lock.json a divergé de package.json.
      - name: Install dependencies
        run: npm ci

      - name: Contrôle de types
        run: npm run check

      - name: Compilation
        run: npm run build
